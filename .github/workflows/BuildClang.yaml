name: 编译Clang多平台（统一Clang + 打包libc++）

on:
  workflow_dispatch:
    inputs:
      llvm_version:
        description: 'LLVM 完整版本号（例如 20.1.8）'
        required: true
        default: '20.1.8'

env:
  LLVM_FULL: ${{ github.event.inputs.llvm_version }}

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64（Alpine 容器，Clang 自举）
          - { target: linux-x86_64, runner: ubuntu-22.04, arch: x86_64, triple: x86_64-alpine-linux-musl, target_os: linux }
          # Linux AArch64（Alpine 容器，Clang 自举）
          - { target: linux-aarch64, runner: ubuntu-22.04-arm, arch: aarch64, triple: aarch64-alpine-linux-musl, target_os: linux }
          # Linux RISC-V 64（使用 RISE 原生 RISC-V Runner，无需 QEMU）
          - { target: linux-riscv64, runner: ubuntu-24.04-riscv, arch: riscv64, triple: riscv64-alpine-linux-musl, target_os: linux }

          # macOS x86_64（使用 Apple Clang）
          - { target: macos-x86_64, runner: macos-13, arch: x86_64, triple: x86_64-apple-darwin, target_os: macos }
          # macOS ARM64（使用 Apple Clang）
          - { target: macos-arm64, runner: macos-14, arch: arm64, triple: arm64-apple-darwin, target_os: macos }

          # Windows（使用预编译 Clang 引导）
          - { target: windows-x86_64, runner: windows-2022, arch: x86_64, triple: x86_64-pc-windows-msvc, target_os: windows }

    steps:
      # ---------- 全局缓存 ----------
      - name: 缓存 LLVM 源码与构建
        uses: actions/cache@v5
        id: cache-llvm
        with:
          path: |
            llvm-project
            llvm-build-cache
          key: llvm-${{ env.LLVM_FULL }}-${{ matrix.target }}-${{ matrix.arch }}-clang-libcxx
          restore-keys: |
            llvm-${{ env.LLVM_FULL }}-${{ matrix.target }}-${{ matrix.arch }}-clang-libcxx-

      # ====================================================
      # 1. Linux 编译（Alpine + Clang 自举 + 静态 libc++）
      # ====================================================
      - name: 编译静态 Clang 并打包 libc++ (Linux)
        if: matrix.target_os == 'linux'
        run: |
          # RISC-V 原生 Runner 上无需 QEMU，直接运行 Alpine 容器
          DOCKER_CMD="docker run --rm -v $(pwd):/workspace -w /workspace"

          # 注意：RISC-V 原生 Runner 是 riscv64 架构，可以直接运行 riscv64 容器
          # 但 Alpine 官方提供 riscv64 镜像，直接使用即可
          $DOCKER_CMD alpine:3.20 sh -c "
            set -e
            apk update
            apk add --no-cache alpine-sdk cmake ninja git python3 \
              clang clang-dev lld musl-dev zlib-dev libxml2-dev ncurses-dev \
              zlib-static libxml2-static ncurses-static

            MAJOR=\$(echo '${{ env.LLVM_FULL }}' | cut -d. -f1)

            cd /workspace
            if [ -d llvm-project ]; then
              echo '使用缓存的 LLVM 源码'
              cd llvm-project
              git remote set-url origin https://gh-proxy.org/https://github.com/llvm/llvm-project.git
              git fetch --depth 1 origin release/\${MAJOR}.x
              git checkout release/\${MAJOR}.x
              git submodule update --init --depth 1 clang cmake compiler-rt libcxx libcxxabi lld clang-tools-extra
            else
              echo '克隆 LLVM 源码（通过代理）'
              git clone --depth 1 --branch release/\${MAJOR}.x https://gh-proxy.org/https://github.com/llvm/llvm-project.git
              cd llvm-project
              git submodule update --init --depth 1 clang cmake compiler-rt libcxx libcxxabi lld clang-tools-extra
            fi

            rm -rf /workspace/llvm-build-cache
            mkdir -p /workspace/llvm-build-cache
            cd /workspace/llvm-build-cache

            export CC=clang
            export CXX=clang++

            cmake -G Ninja /workspace/llvm-project/llvm \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_C_COMPILER=clang \
              -DCMAKE_CXX_COMPILER=clang++ \
              -DCMAKE_SYSTEM_NAME=Linux \
              -DCMAKE_SYSTEM_PROCESSOR=${{ matrix.arch }} \
              -DCMAKE_C_COMPILER_TARGET=${{ matrix.triple }} \
              -DCMAKE_CXX_COMPILER_TARGET=${{ matrix.triple }} \
              -DCMAKE_EXE_LINKER_FLAGS='-static -static-libgcc' \
              -DLLVM_ENABLE_PIC=OFF \
              -DBUILD_SHARED_LIBS=OFF \
              -DLLVM_ENABLE_PROJECTS='clang;lld;clang-tools-extra' \
              -DLLVM_ENABLE_RUNTIMES='libcxx;libcxxabi' \
              -DLLVM_ENABLE_LIBCXX=ON \
              -DLLVM_STATIC_LINK_CXX_STDLIB=ON \
              -DLIBCXX_STATICALLY_LINK_ABI_IN_STATIC_LIBRARY=ON \
              -DLIBCXX_ENABLE_STATIC=ON \
              -DLIBCXX_ENABLE_SHARED=OFF \
              -DLIBCXXABI_ENABLE_STATIC=ON \
              -DLIBCXXABI_ENABLE_SHARED=OFF \
              -DLIBCXXABI_USE_LLVM_UNWINDER=OFF \
              -DLLVM_INCLUDE_TESTS=OFF \
              -DLLVM_INCLUDE_EXAMPLES=OFF \
              -DLLVM_INCLUDE_BENCHMARKS=OFF \
              -DLLVM_ENABLE_TERMINFO=OFF \
              -DCLANG_TOOL_CLANG_TIDY_BUILD=ON \
              -DCLANG_TOOL_CLANG_FORMAT_BUILD=ON \
              -DLLVM_DEFAULT_TARGET_TRIPLE=${{ matrix.triple }} \
              -DLLVM_HOST_TRIPLE=${{ matrix.triple }} \
              -DLLVM_RUNTIME_TARGETS=${{ matrix.triple }}

            # 原生 Runner 使用全部 CPU 核心
            ninja -j\$(nproc)

            mkdir -p /workspace/static-clang/bin
            mkdir -p /workspace/static-clang/include
            mkdir -p /workspace/static-clang/lib

            cp bin/clang /workspace/static-clang/bin/
            cp bin/clang++ /workspace/static-clang/bin/
            cp bin/lld /workspace/static-clang/bin/
            cp bin/clang-tidy /workspace/static-clang/bin/
            cp bin/clang-format /workspace/static-clang/bin/

            cp -r /workspace/llvm-project/libcxx/include /workspace/static-clang/include/libcxx
            cp -r /workspace/llvm-project/libcxxabi/include /workspace/static-clang/include/libcxxabi

            find . -name 'libc++.a' -exec cp {} /workspace/static-clang/lib/ \;
            find . -name 'libc++abi.a' -exec cp {} /workspace/static-clang/lib/ \;
          "

      # ====================================================
      # 2. macOS 编译（Apple Clang 引导 + 静态 libc++）
      # ====================================================
      - name: 编译静态 Clang 并打包 libc++ (macOS)
        if: matrix.target_os == 'macos'
        run: |
          cd ${{ github.workspace }}

          MAJOR=$(echo '${{ env.LLVM_FULL }}' | cut -d. -f1)

          if [ -d llvm-project ]; then
            echo '使用缓存的 LLVM 源码'
            cd llvm-project
            git remote set-url origin https://gh-proxy.org/https://github.com/llvm/llvm-project.git
            git fetch --depth 1 origin release/${MAJOR}.x
            git checkout release/${MAJOR}.x
            git submodule update --init --depth 1 clang cmake compiler-rt libcxx libcxxabi lld clang-tools-extra
          else
            echo '克隆 LLVM 源码（通过代理）'
            git clone --depth 1 --branch release/${MAJOR}.x https://gh-proxy.org/https://github.com/llvm/llvm-project.git
            cd llvm-project
            git submodule update --init --depth 1 clang cmake compiler-rt libcxx libcxxabi lld clang-tools-extra
          fi

          cd ${{ github.workspace }}
          rm -rf llvm-build-cache
          mkdir -p llvm-build-cache
          cd llvm-build-cache

          cmake -G Ninja ../llvm-project/llvm \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DLLVM_ENABLE_PROJECTS='clang;lld;clang-tools-extra' \
            -DLLVM_ENABLE_RUNTIMES='libcxx;libcxxabi' \
            -DLLVM_ENABLE_LIBCXX=ON \
            -DLLVM_STATIC_LINK_CXX_STDLIB=ON \
            -DLIBCXX_STATICALLY_LINK_ABI_IN_STATIC_LIBRARY=ON \
            -DLIBCXX_ENABLE_STATIC=ON \
            -DLIBCXX_ENABLE_SHARED=OFF \
            -DLIBCXXABI_ENABLE_STATIC=ON \
            -DLIBCXXABI_ENABLE_SHARED=OFF \
            -DLLVM_ENABLE_PIC=OFF \
            -DBUILD_SHARED_LIBS=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_ENABLE_TERMINFO=OFF \
            -DCLANG_TOOL_CLANG_TIDY_BUILD=ON \
            -DCLANG_TOOL_CLANG_FORMAT_BUILD=ON \
            -DLLVM_DEFAULT_TARGET_TRIPLE=${{ matrix.triple }} \
            -DLLVM_HOST_TRIPLE=${{ matrix.triple }} \
            -DLLVM_RUNTIME_TARGETS=${{ matrix.triple }} \
            -DRUNTIMES_BUILD_ALLOW_DARWIN=ON

          ninja clang lld clang-tidy clang-format

          mkdir -p ../static-clang/bin ../static-clang/include ../static-clang/lib

          cp bin/clang ../static-clang/bin/
          cp bin/clang++ ../static-clang/bin/
          cp bin/lld ../static-clang/bin/
          cp bin/clang-tidy ../static-clang/bin/
          cp bin/clang-format ../static-clang/bin/

          cp -r ../llvm-project/libcxx/include ../static-clang/include/libcxx
          cp -r ../llvm-project/libcxxabi/include ../static-clang/include/libcxxabi

          find . -name 'libc++.a' -exec cp {} ../static-clang/lib/ \;
          find . -name 'libc++abi.a' -exec cp {} ../static-clang/lib/ \;

      # ====================================================
      # 3. Windows 编译（原生 Clang 引导 + 静态 libc++）
      # ====================================================
      - name: 下载 LLVM 预编译包 (Windows)
        if: matrix.target_os == 'windows'
        shell: pwsh
        run: |
          $full = "${{ env.LLVM_FULL }}"
          $proxy = "https://ghproxy.net/"
          $url = "$proxy/https://github.com/llvm/llvm-project/releases/download/llvmorg-$full/clang+llvm-$full-x86_64-pc-windows-msvc.tar.xz"
          Write-Host "Downloading $url"

          if (-not (Get-Command aria2c -ErrorAction SilentlyContinue)) {
            Write-Host "aria2c 未安装，正在通过 Chocolatey 安装..."
            choco install aria2 -y --limit-output
            $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
            if (-not (Get-Command aria2c -ErrorAction SilentlyContinue)) {
              Write-Warning "aria2c 安装失败，将使用 Invoke-WebRequest 下载"
              $useAria2 = $false
            } else {
              $useAria2 = $true
            }
          } else {
            $useAria2 = $true
          }

          $attempts = 0
          do {
            try {
              if ($useAria2) {
                Write-Host "使用 aria2c 多线程下载 (16线程)"
                aria2c -x 16 -s 16 -k 1M --allow-overwrite=true --out=llvm.tar.xz $url
              } else {
                Write-Host "使用 Invoke-WebRequest 下载"
                Invoke-WebRequest -Uri $url -OutFile llvm.tar.xz -UserAgent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
              }
              break
            } catch {
              $attempts++
              if ($attempts -ge 3) { throw "下载失败，重试已达上限" }
              Write-Host "下载失败，重试 $attempts ..."
              Start-Sleep -Seconds 5
            }
          } while ($true)

          if (-not (Test-Path llvm.tar.xz) -or (Get-Item llvm.tar.xz).Length -eq 0) {
            throw "下载的文件无效或为空"
          }
          Write-Host "下载完成，文件大小: $(Get-Item llvm.tar.xz).Length 字节"

          tar -xvf llvm.tar.xz
          $dir = Get-ChildItem -Directory | Where-Object { $_.Name -like "clang+llvm-$full*" } | Select-Object -First 1
          if (-not $dir) {
            $dir = Get-ChildItem -Directory -Filter "clang+llvm-*" | Select-Object -First 1
          }
          if (-not $dir) {
            throw "未找到解压后的目录"
          }
          Rename-Item -Path $dir.FullName -NewName "llvm-install"
          $binPath = "$(Get-Location)\llvm-install\bin"
          Add-Content $env:GITHUB_PATH $binPath
          echo "CC=clang" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "CXX=clang++" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: 设置 MSVC 环境 (Windows)
        if: matrix.target_os == 'windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: 编译静态 Clang 并打包 libc++ (Windows)
        if: matrix.target_os == 'windows'
        shell: bash
        run: |
          WORKSPACE="$(cygpath -u "${{ github.workspace }}")"
          cd "$WORKSPACE"

          MAJOR=$(echo '${{ env.LLVM_FULL }}' | cut -d. -f1)

          if [ -d llvm-project ]; then
            echo '使用缓存的 LLVM 源码'
            cd llvm-project
            git remote set-url origin https://gh-proxy.org/https://github.com/llvm/llvm-project.git
            git fetch --depth 1 origin release/${MAJOR}.x
            git checkout release/${MAJOR}.x
            git submodule update --init --depth 1 clang cmake compiler-rt libcxx libcxxabi lld clang-tools-extra
          else
            echo '克隆 LLVM 源码（通过代理）'
            git clone --depth 1 --branch release/${MAJOR}.x https://gh-proxy.org/https://github.com/llvm/llvm-project.git
            cd llvm-project
            git submodule update --init --depth 1 clang cmake compiler-rt libcxx libcxxabi lld clang-tools-extra
          fi

          cd "$WORKSPACE"
          rm -rf llvm-build-cache
          mkdir -p llvm-build-cache
          cd llvm-build-cache

          cmake -G Ninja ../llvm-project/llvm \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_COMPILER_TARGET=${{ matrix.triple }} \
            -DCMAKE_CXX_COMPILER_TARGET=${{ matrix.triple }} \
            -DCMAKE_MSVC_RUNTIME_LIBRARY="MultiThreaded" \
            -DLLVM_ENABLE_PIC=OFF \
            -DBUILD_SHARED_LIBS=OFF \
            -DLLVM_ENABLE_PROJECTS='clang;lld;clang-tools-extra' \
            -DLLVM_ENABLE_RUNTIMES='libcxx;libcxxabi' \
            -DLLVM_ENABLE_LIBCXX=ON \
            -DLLVM_STATIC_LINK_CXX_STDLIB=ON \
            -DLIBCXX_STATICALLY_LINK_ABI_IN_STATIC_LIBRARY=ON \
            -DLIBCXX_ENABLE_STATIC=ON \
            -DLIBCXX_ENABLE_SHARED=OFF \
            -DLIBCXXABI_ENABLE_STATIC=ON \
            -DLIBCXXABI_ENABLE_SHARED=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_ENABLE_TERMINFO=OFF \
            -DCLANG_TOOL_CLANG_TIDY_BUILD=ON \
            -DCLANG_TOOL_CLANG_FORMAT_BUILD=ON \
            -DLLVM_DEFAULT_TARGET_TRIPLE=${{ matrix.triple }} \
            -DLLVM_HOST_TRIPLE=${{ matrix.triple }} \
            -DLLVM_RUNTIME_TARGETS=${{ matrix.triple }}

          NPROC=$(nproc 2>/dev/null || echo 4)
          ninja -j$NPROC

          mkdir -p ../static-clang/bin ../static-clang/include ../static-clang/lib

          cp bin/clang.exe ../static-clang/bin/
          cp bin/clang++.exe ../static-clang/bin/
          cp bin/lld.exe ../static-clang/bin/
          cp bin/clang-tidy.exe ../static-clang/bin/
          cp bin/clang-format.exe ../static-clang/bin/

          cp -r ../llvm-project/libcxx/include ../static-clang/include/libcxx
          cp -r ../llvm-project/libcxxabi/include ../static-clang/include/libcxxabi

          find . -name 'libc++.lib' -exec cp {} ../static-clang/lib/ \;
          find . -name 'libc++abi.lib' -exec cp {} ../static-clang/lib/ \;

      # ====================================================
      # 4. 打包二进制文件（包含 bin、include、lib）
      # ====================================================
      - name: 打包完整目录
        run: tar -czf clang-${{ matrix.target }}.tar.gz -C static-clang .

      # ====================================================
      # 5. 部署到 StaticClangPool 仓库
      # ====================================================
      - name: 拉取 StaticClangPool 仓库（Majority 分支）
        uses: actions/checkout@v4
        with:
          repository: Com-Group/StaticClangPool
          ref: Majority
          token: ${{ secrets.REPO_ACCESS_TOKEN }}
          lfs: true
          path: deploy-repo

      - name: 解压并提交（保持 bin、include、lib 结构）
        run: |
          cd deploy-repo
          mkdir -p Clang/${{ matrix.target }}
          tar -xzf ../clang-${{ matrix.target }}.tar.gz -C Clang/${{ matrix.target }}

          git lfs install
          git lfs track "*.exe" "*.a" "*.lib" "*.dll" "*.so" "*.dylib"

          git add Clang/ .gitattributes

          # 如果历史中有大文件，迁移到 LFS
          if git lfs migrate info --include="*.exe,*.a,*.lib,*.dll,*.so,*.dylib" 2>/dev/null | grep -q "objects"; then
            echo "检测到历史中的大文件，正在迁移到 LFS..."
            git lfs migrate import --include="*.exe,*.a,*.lib,*.dll,*.so,*.dylib" --everything --verbose
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --staged --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "[skip ci] 更新 Clang ${{ env.LLVM_FULL }} - ${{ matrix.target }}（统一Clang + libc++）"
            git push --force
          fi

      # （可选）上传构建产物
      - name: 上传构建产物（可选）
        uses: actions/upload-artifact@v4
        with:
          name: clang-${{ matrix.target }}
          path: clang-${{ matrix.target }}.tar.gz
