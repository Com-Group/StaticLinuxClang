name: 编译Clang多平台

on:
  workflow_dispatch:
    inputs:
      llvm_version:
        description: 'LLVM 版本号'
        required: true
        default: '20'

env:
  LLVM_VERSION: ${{ github.event.inputs.llvm_version }}

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ========== Linux 静态构建 (保留原有逻辑) ==========
          - { target: linux-x86_64, runner: ubuntu-22.04, arch: x86_64, triple: x86_64-alpine-linux-musl, target_os: linux }
          - { target: linux-aarch64, runner: ubuntu-22.04-arm, arch: aarch64, triple: aarch64-alpine-linux-musl, target_os: linux }
          - { target: linux-riscv64, runner: ubuntu-22.04-riscv, arch: riscv64, triple: riscv64-alpine-linux-musl, target_os: linux }

          # ========== macOS 动态构建 (新增) ==========
          - { target: macos-x86_64, runner: macos-13, arch: x86_64, triple: x86_64-apple-darwin, target_os: macos }
          - { target: macos-arm64, runner: macos-14, arch: arm64, triple: arm64-apple-darwin, target_os: macos }

          # ========== Windows 动态构建 (新增) ==========
          - { target: windows-x86_64, runner: windows-2022, arch: x86_64, triple: x86_64-pc-windows-msvc, target_os: windows }

    steps:
      # ---------- 全局缓存（适用于所有平台） ----------
      - name: 缓存 LLVM 源码与构建
        uses: actions/cache@v3
        id: cache-llvm
        with:
          path: |
            llvm-project
            llvm-build-cache
          # 修复点：去掉 github.sha，用 target 区分不同平台缓存
          key: llvm-${{ env.LLVM_VERSION }}-${{ matrix.target }}
          restore-keys: |
            llvm-${{ env.LLVM_VERSION }}-${{ matrix.target }}-

      # ====================================================
      # 1. Linux 编译（全静态，Alpine 容器内进行）
      # ====================================================
      - name: 安装 Docker（Linux 宿主机）
        if: matrix.target_os == 'linux'
        run: |
          sudo apt update && sudo apt install -y docker.io
          sudo systemctl start docker

      - name: 编译静态 Clang (Linux)
        if: matrix.target_os == 'linux'
        run: |
          docker run --rm -v $(pwd):/workspace -w /workspace alpine:latest sh -c "
            set -e

            apk update
            apk add --no-cache alpine-sdk cmake ninja clang lld git python3 \
              musl-dev zlib-dev libxml2-dev ncurses-dev
            apk add --no-cache zlib-static libxml2-static ncurses-static libatomic-static

            if [ -d llvm-project ]; then
              echo '使用缓存的 LLVM 源码'
              cd llvm-project
              git submodule update --init --depth 1 clang cmake compiler-rt libcxx libcxxabi lld clang-tools-extra
            else
              echo '克隆 LLVM 源码'
              git clone --depth 1 --branch release/${{ env.LLVM_VERSION }}.x https://github.com/llvm/llvm-project.git
              cd llvm-project
              git submodule update --init --depth 1 clang cmake compiler-rt libcxx libcxxabi lld clang-tools-extra
            fi

            mkdir -p /workspace/llvm-build-cache
            cd /workspace/llvm-build-cache

            cmake -G Ninja /workspace/llvm-project/llvm \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_C_COMPILER=clang \
              -DCMAKE_CXX_COMPILER=clang++ \
              -DCMAKE_SYSTEM_NAME=Linux \
              -DCMAKE_C_COMPILER_TARGET=${{ matrix.triple }} \
              -DCMAKE_CXX_COMPILER_TARGET=${{ matrix.triple }} \
              -DCMAKE_EXE_LINKER_FLAGS='-static -static-libgcc' \
              -DLLVM_ENABLE_PIC=OFF \
              -DBUILD_SHARED_LIBS=OFF \
              -DLLVM_ENABLE_PROJECTS='clang;lld;clang-tools-extra' \
              -DLLVM_ENABLE_RUNTIMES='libcxx;libcxxabi;compiler-rt' \
              -DLLVM_INCLUDE_TESTS=OFF \
              -DLLVM_INCLUDE_EXAMPLES=OFF \
              -DLLVM_INCLUDE_BENCHMARKS=OFF \
              -DLLVM_ENABLE_TERMINFO=OFF \
              -DCLANG_TOOL_CLANG_TIDY_BUILD=ON \
              -DCLANG_TOOL_CLANG_FORMAT_BUILD=ON \
              -DCLANG_TOOL_CLANG_RENAME_BUILD=OFF \
              -DCLANG_TOOL_CLANG_REPL_BUILD=OFF \
              -DCLANG_TOOL_CLANG_OFFLOAD_BUNDLER_BUILD=OFF \
              -DCLANG_TOOL_SCAN_VIEW_BUILD=OFF \
              -DCLANG_TOOL_SCAN_BUILD_BUILD=OFF

            ninja -j\$(nproc)

            mkdir -p /workspace/static-clang/bin
            cp bin/clang /workspace/static-clang/bin/
            cp bin/clang++ /workspace/static-clang/bin/
            cp bin/lld /workspace/static-clang/bin/
            cp bin/clang-tidy /workspace/static-clang/bin/
            cp bin/clang-format /workspace/static-clang/bin/
          "

      # ====================================================
      # 2. macOS 编译（动态链接，不使用 static 标志）
      # ====================================================
      - name: 编译 Clang (macOS)
        if: matrix.target_os == 'macos'
        run: |
          # 进入工作目录
          cd ${{ github.workspace }}

          # 准备源码
          if [ -d llvm-project ]; then
            echo '使用缓存的 LLVM 源码'
            cd llvm-project
            git submodule update --init --depth 1 clang cmake compiler-rt libcxx libcxxabi lld clang-tools-extra
          else
            echo '克隆 LLVM 源码'
            git clone --depth 1 --branch release/${{ env.LLVM_VERSION }}.x https://github.com/llvm/llvm-project.git
            cd llvm-project
            git submodule update --init --depth 1 clang cmake compiler-rt libcxx libcxxabi lld clang-tools-extra
          fi

          cd ${{ github.workspace }}
          mkdir -p llvm-build-cache
          cd llvm-build-cache

          # macOS 编译：不添加 -static，使用系统默认动态链接
          cmake -G Ninja ../llvm-project/llvm \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DLLVM_ENABLE_PIC=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -DLLVM_ENABLE_PROJECTS='clang;lld;clang-tools-extra' \
            -DLLVM_ENABLE_RUNTIMES='libcxx;libcxxabi;compiler-rt' \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DCLANG_TOOL_CLANG_TIDY_BUILD=ON \
            -DCLANG_TOOL_CLANG_FORMAT_BUILD=ON

          ninja -j$(sysctl -n hw.ncpu)

          mkdir -p ../static-clang/bin
          cp bin/clang ../static-clang/bin/
          cp bin/clang++ ../static-clang/bin/
          cp bin/lld ../static-clang/bin/
          cp bin/clang-tidy ../static-clang/bin/
          cp bin/clang-format ../static-clang/bin/

      # ====================================================
      # 3. Windows 编译（动态链接 MSVC 运行时）
      # ====================================================
      - name: 设置 MSVC 环境 (Windows)
        if: matrix.target_os == 'windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: 编译 Clang (Windows)
        if: matrix.target_os == 'windows'
        shell: bash
        run: |
          cd ${{ github.workspace }}

          # 准备源码
          if [ -d llvm-project ]; then
            echo '使用缓存的 LLVM 源码'
            cd llvm-project
            # Windows 下不需要 compiler-rt 和 libcxx（使用 MSVC 标准库），仅拉取必要项目
            git submodule update --init --depth 1 clang cmake lld clang-tools-extra
          else
            echo '克隆 LLVM 源码'
            git clone --depth 1 --branch release/${{ env.LLVM_VERSION }}.x https://github.com/llvm/llvm-project.git
            cd llvm-project
            git submodule update --init --depth 1 clang cmake lld clang-tools-extra
          fi

          cd ${{ github.workspace }}
          mkdir -p llvm-build-cache
          cd llvm-build-cache

          # Windows 编译：使用 MSVC cl.exe 编译，动态链接 /MD（默认）
          cmake -G Ninja ../llvm-project/llvm \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=cl \
            -DCMAKE_CXX_COMPILER=cl \
            -DLLVM_ENABLE_PIC=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -DLLVM_ENABLE_PROJECTS='clang;lld;clang-tools-extra' \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DCLANG_TOOL_CLANG_TIDY_BUILD=ON \
            -DCLANG_TOOL_CLANG_FORMAT_BUILD=ON \
            -DLLVM_DEFAULT_TARGET_TRIPLE=x86_64-pc-windows-msvc

          ninja -j$(nproc)

          mkdir -p ../static-clang/bin
          cp bin/clang.exe ../static-clang/bin/
          cp bin/clang++.exe ../static-clang/bin/
          cp bin/lld.exe ../static-clang/bin/
          cp bin/clang-tidy.exe ../static-clang/bin/
          cp bin/clang-format.exe ../static-clang/bin/

      # ====================================================
      # 4. 通用打包 & 部署（所有平台统一处理）
      # ====================================================
      - name: 打包二进制文件
        run: tar -czf clang-${{ matrix.target }}.tar.gz -C static-clang .

      - name: 拉取 StaticClangPool 仓库（Majority 分支）
        uses: actions/checkout@v4
        with:
          repository: Com-Group/StaticClangPool
          ref: Majority
          token: ${{ secrets.REPO_ACCESS_TOKEN }}
          lfs: true
          path: deploy-repo

      - name: 解压并提交（按 target 目录存放）
        run: |
          cd deploy-repo
          mkdir -p Clang/${{ matrix.target }}/bin
          tar -xzf ../clang-${{ matrix.target }}.tar.gz -C Clang/${{ matrix.target }}
          
          git lfs install
          # 修复 LFS 匹配规则：匹配所有子目录下的 clang* 和 *.exe
          git lfs track "Clang/**/clang*" "Clang/**/*.exe"
          
          git add Clang/ .gitattributes
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          if git diff --staged --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "[skip ci] 更新 Clang ${{ env.LLVM_VERSION }} - ${{ matrix.target }}"
            git push
          fi
