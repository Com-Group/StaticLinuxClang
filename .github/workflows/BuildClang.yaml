name: 编译Clang多平台（高度静态化）

on:
  workflow_dispatch:
    inputs:
      llvm_version:
        description: 'LLVM 版本号'
        required: true
        default: '20'

env:
  LLVM_VERSION: ${{ github.event.inputs.llvm_version }}

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          # ========== Linux 静态构建（全静态，musl） ==========
          - { target: linux-x86_64, runner: ubuntu-22.04, arch: x86_64, triple: x86_64-alpine-linux-musl, target_os: linux, use_qemu: false }
          - { target: linux-aarch64, runner: ubuntu-22.04-arm, arch: aarch64, triple: aarch64-alpine-linux-musl, target_os: linux, use_qemu: false }
          - { target: linux-riscv64, runner: ubuntu-22.04, arch: riscv64, triple: riscv64-alpine-linux-musl, target_os: linux, use_qemu: true }

          # ========== macOS 高度静态化（Bootstrap + 静态 libc++） ==========
          - { target: macos-x86_64, runner: macos-13, arch: x86_64, triple: x86_64-apple-darwin, target_os: macos }
          - { target: macos-arm64, runner: macos-14, arch: arm64, triple: arm64-apple-darwin, target_os: macos }

          # ========== Windows 完全静态（静态 CRT /MT） ==========
          - { target: windows-x86_64, runner: windows-2022, arch: x86_64, triple: x86_64-pc-windows-msvc, target_os: windows }

    steps:
      # ---------- 全局缓存（配置变更后缓存自动失效） ----------
      - name: 缓存 LLVM 源码与构建
        uses: actions/cache@v5               # 升级到 v5 以支持 Node.js 24
        id: cache-llvm
        with:
          path: |
            llvm-project
            llvm-build-cache
          key: llvm-${{ env.LLVM_VERSION }}-${{ matrix.target }}-static
          restore-keys: |
            llvm-${{ env.LLVM_VERSION }}-${{ matrix.target }}-static-

      # ====================================================
      # 1. Linux 编译（全静态，Alpine 容器内）
      # ====================================================
      - name: 编译静态 Clang (Linux)
        if: matrix.target_os == 'linux'
        run: |
          if [ "${{ matrix.use_qemu }}" = "true" ]; then
            sudo apt-get update
            sudo apt-get install -y qemu-user-static binfmt-support
          fi

          DOCKER_CMD="docker run --rm -v $(pwd):/workspace -w /workspace"
          if [ "${{ matrix.use_qemu }}" = "true" ]; then
            DOCKER_CMD="$DOCKER_CMD --platform linux/${{ matrix.arch }}"
          fi

          # 使用固定版本 alpine:3.20 避免包名变动，并移除不存在的 libatomic-static
          $DOCKER_CMD alpine:3.20 sh -c "
            set -e
            apk update
            apk add --no-cache alpine-sdk cmake ninja clang lld git python3 \
              musl-dev zlib-dev libxml2-dev ncurses-dev
            apk add --no-cache zlib-static libxml2-static ncurses-static
            # 注：libatomic-static 在 Alpine 仓库中不存在，已移除

            if [ -d llvm-project ]; then
              echo '使用缓存的 LLVM 源码'
              cd llvm-project
              git submodule update --init --depth 1 clang cmake compiler-rt libcxx libcxxabi lld clang-tools-extra
            else
              echo '克隆 LLVM 源码'
              git clone --depth 1 --branch release/${{ env.LLVM_VERSION }}.x https://github.com/llvm/llvm-project.git
              cd llvm-project
              git submodule update --init --depth 1 clang cmake compiler-rt libcxx libcxxabi lld clang-tools-extra
            fi

            mkdir -p /workspace/llvm-build-cache
            cd /workspace/llvm-build-cache

            cmake -G Ninja /workspace/llvm-project/llvm \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_C_COMPILER=clang \
              -DCMAKE_CXX_COMPILER=clang++ \
              -DCMAKE_SYSTEM_NAME=Linux \
              -DCMAKE_C_COMPILER_TARGET=${{ matrix.triple }} \
              -DCMAKE_CXX_COMPILER_TARGET=${{ matrix.triple }} \
              -DCMAKE_EXE_LINKER_FLAGS='-static -static-libgcc' \
              -DLLVM_ENABLE_PIC=OFF \
              -DBUILD_SHARED_LIBS=OFF \
              -DLLVM_ENABLE_PROJECTS='clang;lld;clang-tools-extra' \
              -DLLVM_ENABLE_RUNTIMES='libcxx;libcxxabi;compiler-rt' \
              -DLLVM_INCLUDE_TESTS=OFF \
              -DLLVM_INCLUDE_EXAMPLES=OFF \
              -DLLVM_INCLUDE_BENCHMARKS=OFF \
              -DLLVM_ENABLE_TERMINFO=OFF \
              -DCLANG_TOOL_CLANG_TIDY_BUILD=ON \
              -DCLANG_TOOL_CLANG_FORMAT_BUILD=ON \
              -DCLANG_TOOL_CLANG_RENAME_BUILD=OFF \
              -DCLANG_TOOL_CLANG_REPL_BUILD=OFF \
              -DCLANG_TOOL_CLANG_OFFLOAD_BUNDLER_BUILD=OFF \
              -DCLANG_TOOL_SCAN_VIEW_BUILD=OFF \
              -DCLANG_TOOL_SCAN_BUILD_BUILD=OFF

            if [ "${{ matrix.use_qemu }}" = "true" ]; then
              ninja -j2
            else
              ninja -j\$(nproc)
            fi

            mkdir -p /workspace/static-clang/bin
            cp bin/clang /workspace/static-clang/bin/
            cp bin/clang++ /workspace/static-clang/bin/
            cp bin/lld /workspace/static-clang/bin/
            cp bin/clang-tidy /workspace/static-clang/bin/
            cp bin/clang-format /workspace/static-clang/bin/
          "

      # ====================================================
      # 2. macOS 编译（Bootstrap 两阶段，第二阶段静态链接 libc++）
      # ====================================================
      - name: 编译高度静态 Clang (macOS)
        if: matrix.target_os == 'macos'
        run: |
          cd ${{ github.workspace }}

          if [ -d llvm-project ]; then
            echo '使用缓存的 LLVM 源码'
            cd llvm-project
            git submodule update --init --depth 1 clang cmake compiler-rt libcxx libcxxabi lld clang-tools-extra
          else
            echo '克隆 LLVM 源码'
            git clone --depth 1 --branch release/${{ env.LLVM_VERSION }}.x https://github.com/llvm/llvm-project.git
            cd llvm-project
            git submodule update --init --depth 1 clang cmake compiler-rt libcxx libcxxabi lld clang-tools-extra
          fi

          cd ${{ github.workspace }}
          mkdir -p llvm-build-cache
          cd llvm-build-cache

          # 启用 Bootstrap 构建，并将静态化参数传递给 Stage2
          cmake -G Ninja ../llvm-project/llvm \
            -DCMAKE_BUILD_TYPE=Release \
            -DCLANG_ENABLE_BOOTSTRAP=ON \
            -DCLANG_BOOTSTRAP_CMAKE_ARGS="-DLLVM_ENABLE_LIBCXX=ON -DLLVM_STATIC_LINK_CXX_STDLIB=ON -DLIBCXX_STATICALLY_LINK_ABI_IN_STATIC_LIBRARY=ON -DLLVM_ENABLE_LLD=ON -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0" \
            -DLLVM_ENABLE_PROJECTS='clang;lld;clang-tools-extra' \
            -DLLVM_ENABLE_RUNTIMES='libcxx;libcxxabi;compiler-rt' \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_ENABLE_TERMINFO=OFF \
            -DCLANG_TOOL_CLANG_TIDY_BUILD=ON \
            -DCLANG_TOOL_CLANG_FORMAT_BUILD=ON

          # 构建 Stage2（bootstrap 的最终产物）
          ninja stage2

          # 从 Stage2 的 bin 目录复制二进制文件
          mkdir -p ../static-clang/bin
          cp stage2/bin/clang ../static-clang/bin/
          cp stage2/bin/clang++ ../static-clang/bin/
          cp stage2/bin/lld ../static-clang/bin/
          cp stage2/bin/clang-tidy ../static-clang/bin/
          cp stage2/bin/clang-format ../static-clang/bin/

      # ====================================================
      # 3. Windows 编译（静态链接 MSVC CRT /MT）
      # ====================================================
      - name: 设置 MSVC 环境 (Windows)
        if: matrix.target_os == 'windows'
        uses: ilammy/msvc-dev-cmd@v1
        # 注：该 Action 目前尚未更新以支持 Node.js 24，但暂时可正常工作
        # 关注 https://github.com/ilammy/msvc-dev-cmd 获取更新

      - name: 编译静态链接 CRT 的 Clang (Windows)
        if: matrix.target_os == 'windows'
        shell: bash
        run: |
          cd ${{ github.workspace }}

          if [ -d llvm-project ]; then
            echo '使用缓存的 LLVM 源码'
            cd llvm-project
            git submodule update --init --depth 1 clang cmake lld clang-tools-extra
          else
            echo '克隆 LLVM 源码'
            git clone --depth 1 --branch release/${{ env.LLVM_VERSION }}.x https://github.com/llvm/llvm-project.git
            cd llvm-project
            git submodule update --init --depth 1 clang cmake lld clang-tools-extra
          fi

          cd ${{ github.workspace }}
          mkdir -p llvm-build-cache
          cd llvm-build-cache

          cmake -G Ninja ../llvm-project/llvm \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=cl \
            -DCMAKE_CXX_COMPILER=cl \
            -DCMAKE_MSVC_RUNTIME_LIBRARY="MultiThreaded" \
            -DLLVM_ENABLE_PIC=OFF \
            -DBUILD_SHARED_LIBS=OFF \
            -DLLVM_ENABLE_PROJECTS='clang;lld;clang-tools-extra' \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_ENABLE_TERMINFO=OFF \
            -DCLANG_TOOL_CLANG_TIDY_BUILD=ON \
            -DCLANG_TOOL_CLANG_FORMAT_BUILD=ON \
            -DLLVM_DEFAULT_TARGET_TRIPLE=x86_64-pc-windows-msvc

          ninja -j$(nproc)

          mkdir -p ../static-clang/bin
          cp bin/clang.exe ../static-clang/bin/
          cp bin/clang++.exe ../static-clang/bin/
          cp bin/lld.exe ../static-clang/bin/
          cp bin/clang-tidy.exe ../static-clang/bin/
          cp bin/clang-format.exe ../static-clang/bin/

      # ====================================================
      # 4. 通用打包 & 部署
      # ====================================================
      - name: 打包二进制文件
        run: tar -czf clang-${{ matrix.target }}.tar.gz -C static-clang .

      - name: 拉取 StaticClangPool 仓库（Majority 分支）
        uses: actions/checkout@v4
        with:
          repository: Com-Group/StaticClangPool   # ⚠️ 请修改为你的目标仓库
          ref: Majority                           # ⚠️ 请修改为你的目标分支
          token: ${{ secrets.REPO_ACCESS_TOKEN }}
          lfs: true

      - name: 解压并提交（按 target 目录存放）
        run: |
          cd deploy-repo
          mkdir -p Clang/${{ matrix.target }}/bin
          tar -xzf ../clang-${{ matrix.target }}.tar.gz -C Clang/${{ matrix.target }}
          
          git lfs install
          git lfs track "Clang/**/clang*" "Clang/**/*.exe"
          
          git add Clang/ .gitattributes
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          if git diff --staged --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "[skip ci] 更新 Clang ${{ env.LLVM_VERSION }} - ${{ matrix.target }}（高度静态化）"
            git push
          fi
