name: Build with Clang & libc++

on:
  workflow_dispatch:
    inputs:
      llvm_version:
        description: 'LLVM 版本号（例如 18.1.8）'
        required: true
        default: '18.1.8'
      macos_deployment_target:
        description: 'macOS 最低部署目标（仅 macOS 平台使用，例如 10.15 或 11.0）'
        required: false
        default: '10.15'

jobs:
  multi-platform-build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x86_64, runner: ubuntu-24.04, arch: x86_64, triple: x86_64-linux-musl, target_os: linux }
          - { target: linux-aarch64, runner: ubuntu-24.04-arm, arch: aarch64, triple: aarch64-linux-musl, target_os: linux }
          - { target: linux-riscv64, runner: ubuntu-24.04-riscv, arch: riscv64, triple: riscv64-linux-musl, target_os: linux }
          - { target: macos-x86_64, runner: macos-13, arch: x86_64, triple: x86_64-apple-darwin, target_os: macos }
          - { target: macos-arm64, runner: macos-14, arch: arm64, triple: arm64-apple-darwin, target_os: macos }
          - { target: windows-x86_64, runner: windows-2022, arch: x86_64, triple: x86_64-pc-windows-msvc, target_os: windows }

    steps:
      - name: Checkout 当前仓库
        uses: actions/checkout@v4

      # --------------------------------------------
      # 1. 安装 Node.js（仅当存在 package.json）
      # --------------------------------------------
      - name: 安装 Node.js (LTS)
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      # --------------------------------------------
      # 2. 安装/更新系统级 LLVM 工具链（引导编译）
      # --------------------------------------------
      - name: 安装/更新 LLVM 工具链（Linux）
        if: matrix.target_os == 'linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y clang libc++-dev libc++abi-dev ninja-build
          clang --version
        shell: bash

      - name: 安装/更新 LLVM 工具链（macOS）
        if: matrix.target_os == 'macos'
        run: |
          brew update
          brew install llvm ninja || brew upgrade llvm ninja
          if [[ "${{ matrix.arch }}" == "arm64" ]]; then
            echo "/opt/homebrew/opt/llvm/bin" >> $GITHUB_PATH
          else
            echo "/usr/local/opt/llvm/bin" >> $GITHUB_PATH
          fi
          clang --version
        shell: bash

      - name: 安装/更新 LLVM-MinGW 工具链（Windows）
        if: matrix.target_os == 'windows'
        run: |
          choco list llvm-mingw --local-only --limit-output || choco install llvm-mingw -y
          choco upgrade llvm-mingw -y
          choco install ninja -y
          $mingw_path = (Get-ChildItem -Path "C:\ProgramData\chocolatey\lib\llvm-mingw" -Directory | Select-Object -First 1).FullName
          if ($mingw_path) {
            $bin_path = Join-Path $mingw_path "bin"
            if (Test-Path $bin_path) {
              echo "$bin_path" >> $env:GITHUB_PATH
            }
          }
          clang --version
        shell: pwsh

      # --------------------------------------------
      # 3. 下载 LLVM 源代码
      # --------------------------------------------
      - name: 克隆 LLVM 项目
        run: |
          VERSION="${{ github.event.inputs.llvm_version }}"
          LLVM_TAG="llvmorg-${VERSION}"
          echo "克隆标签: $LLVM_TAG"
          git clone --depth 1 --branch "$LLVM_TAG" https://github.com/llvm/llvm-project.git llvm-project
          cd llvm-project
          git describe --tags --always
        shell: bash

      # --------------------------------------------
      # 4. （仅 Linux）编译 musl libc 并安装为 sysroot
      # --------------------------------------------
      - name: 构建 musl libc（Linux）
        if: matrix.target_os == 'linux'
        run: |
          echo "--- 下载 musl 源码 ---"
          git clone https://git.musl-libc.org/git/musl musl-src
          cd musl-src
          echo "--- 配置 musl（安装到 $PWD/../musl-sysroot/usr） ---"
          ./configure --prefix=/usr --disable-shared  # 仅静态库，便于封装
          make -j$(nproc)
          # 安装到 musl-sysroot 目录，结构为 usr/include, usr/lib 等
          make install DESTDIR="$PWD/../musl-sysroot"
          cd ..
          echo "musl 安装完成，sysroot 位于: $PWD/musl-sysroot"
        shell: bash

      # --------------------------------------------
      # 5. 构建 LLVM（使用 musl 作为默认 libc）
      # --------------------------------------------
      - name: 构建 LLVM（默认使用 musl）
        run: |
          INSTALL_DIR="$PWD/install"
          echo "安装目录: $INSTALL_DIR"
          rm -rf "$INSTALL_DIR"
          mkdir -p "$INSTALL_DIR"

          # 设置 sysroot（仅 Linux）
          if [[ "${{ matrix.target_os }}" == "linux" ]]; then
            SYSROOT="$PWD/musl-sysroot"
            echo "使用 musl sysroot: $SYSROOT"
          else
            SYSROOT=""
          fi

          mkdir build && cd build

          CMAKE_ARGS=(
            -G Ninja
            -DCMAKE_BUILD_TYPE=Release
            -DLLVM_ENABLE_PROJECTS="clang;clang-tools-extra"
            -DLLVM_ENABLE_RUNTIMES="libcxx;libcxxabi"
            -DLLVM_TARGETS_TO_BUILD="host"
            -DCMAKE_INSTALL_PREFIX="$INSTALL_DIR"
            -DLLVM_INCLUDE_BENCHMARKS=OFF
            -DLLVM_INCLUDE_TESTS=OFF
            -DLLVM_INCLUDE_EXAMPLES=OFF
            -DLLVM_INCLUDE_DOCS=OFF
            -DCLANG_DEFAULT_CXX_STDLIB=libc++
            -DLIBCXX_ENABLE_STATIC_ABI_LIBRARY=ON
            -DLIBCXX_USE_COMPILER_RT=OFF
            -DLIBCXXABI_USE_COMPILER_RT=OFF
            -DCMAKE_CXX_STANDARD=17
            -DCMAKE_C_STANDARD=11
          )

          if [[ "${{ matrix.target_os }}" == "linux" ]]; then
            # 使用系统 clang 编译，但指定目标为 musl 三元组
            CMAKE_ARGS+=(
              -DCMAKE_C_COMPILER=clang
              -DCMAKE_CXX_COMPILER=clang++
              -DLLVM_DEFAULT_TARGET_TRIPLE="${{ matrix.triple }}"
              -DCMAKE_SYSROOT="$SYSROOT"
              # 强制使用 musl 的库和头文件
              -DC_INCLUDE_DIRS="$SYSROOT/usr/include"
              -DCXX_INCLUDE_DIRS="$SYSROOT/usr/include/c++/v1"  # libc++ 头文件仍来自 LLVM，但这里我们用 musl 的 C 头文件
            )
            # 注意：libc++ 的编译会依赖 glibc 头文件？我们需要确保 libc++ 编译时使用 musl 的 sysroot
            # 可以额外传递 -DCMAKE_CXX_FLAGS="--sysroot=$SYSROOT" 等
            export CFLAGS="--sysroot=$SYSROOT"
            export CXXFLAGS="--sysroot=$SYSROOT"
          elif [[ "${{ matrix.target_os }}" == "macos" ]]; then
            DEPLOY_TARGET="${{ github.event.inputs.macos_deployment_target }}"
            export MACOSX_DEPLOYMENT_TARGET="$DEPLOY_TARGET"
            CMAKE_ARGS+=(
              -DCMAKE_C_COMPILER=clang
              -DCMAKE_CXX_COMPILER=clang++
              -DCMAKE_OSX_DEPLOYMENT_TARGET="$DEPLOY_TARGET"
            )
          elif [[ "${{ matrix.target_os }}" == "windows" ]]; then
            CMAKE_ARGS+=(
              -DCMAKE_C_COMPILER=clang
              -DCMAKE_CXX_COMPILER=clang++
              -DCMAKE_SYSTEM_NAME=Windows
              -DCMAKE_SYSTEM_PROCESSOR=${{ matrix.arch }}
              -DLLVM_DEFAULT_TARGET_TRIPLE=${{ matrix.triple }}
            )
          fi

          cmake "${CMAKE_ARGS[@]}" ../llvm-project/llvm
          ninja -j$(nproc 2>/dev/null || echo 2) install
        shell: bash

      # --------------------------------------------
      # 6. 验证安装（查看新 clang 的默认 target）
      # --------------------------------------------
      - name: 验证 Clang 默认 target 和 sysroot
        run: |
          INSTALL_DIR="$PWD/install"
          "$INSTALL_DIR/bin/clang" --version
          echo "--- 默认目标三元组 ---"
          "$INSTALL_DIR/bin/clang" -dumpmachine || echo "无法获取"
          echo "--- 搜索路径 ---"
          "$INSTALL_DIR/bin/clang" -print-search-dirs || echo "无法获取"
        shell: bash

      # --------------------------------------------
      # 7. （可选）npm 安装及构建
      # --------------------------------------------
      - name: 安装项目依赖（npm）
        if: hashFiles('package.json') != ''
        run: npm ci
        shell: bash

      - name: 执行构建（npm）
        if: hashFiles('package.json') != ''
        run: |
          INSTALL_DIR="$PWD/install"
          export PATH="$INSTALL_DIR/bin:$PATH"
          echo "当前目标: ${{ matrix.target }}"
          echo "架构: ${{ matrix.arch }}"
          echo "三元组: ${{ matrix.triple }}"
          clang --version
          npm run build
        shell: bash

      # --------------------------------------------
      # 8. 打包并上传 Release
      # --------------------------------------------
      - name: 打包工具链
        run: |
          case "${{ matrix.arch }}" in
            x86_64) ARCH_NAME="x86" ;;
            aarch64|arm64) ARCH_NAME="ARM" ;;
            riscv64) ARCH_NAME="RISC-V" ;;
            *) ARCH_NAME="${{ matrix.arch }}" ;;
          esac
          case "${{ matrix.target_os }}" in
            linux) OS_NAME="Linux" ;;
            macos) OS_NAME="macOS" ;;
            windows) OS_NAME="Windows" ;;
            *) OS_NAME="${{ matrix.target_os }}" ;;
          esac
          BIT="64-bit"
          PACKAGE_NAME="StaticClangChain--${BIT}--${ARCH_NAME}--${OS_NAME}.tar.gz"
          echo "压缩包名称: $PACKAGE_NAME"
          echo "PACKAGE_NAME=$PACKAGE_NAME" >> $GITHUB_ENV
          tar czf "$PACKAGE_NAME" -C "$PWD" install/
        shell: bash

      - name: 上传至 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "StaticClang-${{ github.event.inputs.llvm_version }}"
          name: "StaticClang-${{ github.event.inputs.llvm_version }}"
          files: ${{ env.PACKAGE_NAME }}
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
