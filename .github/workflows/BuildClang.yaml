name: Build Static Clang (musl)

on:
  workflow_dispatch:
    inputs:
      llvm_version:
        description: 'LLVM 版本号（例如 18.1.8）'
        required: true
        default: '18.1.8'
      macos_deployment_target:
        description: 'macOS 最低部署目标（仅 macOS 平台使用）'
        required: false
        default: '10.15'

jobs:
  multi-platform-build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x86_64, runner: ubuntu-24.04, arch: x86_64, triple: x86_64-linux-musl, target_os: linux }
          - { target: linux-aarch64, runner: ubuntu-24.04-arm, arch: aarch64, triple: aarch64-linux-musl, target_os: linux }
          - { target: linux-riscv64, runner: ubuntu-24.04-riscv, arch: riscv64, triple: riscv64-linux-musl, target_os: linux }
          - { target: macos-x86_64, runner: macos-13, arch: x86_64, triple: x86_64-apple-darwin, target_os: macos }
          - { target: macos-arm64, runner: macos-14, arch: arm64, triple: arm64-apple-darwin, target_os: macos }
          - { target: windows-x86_64, runner: windows-2022, arch: x86_64, triple: x86_64-pc-windows-msvc, target_os: windows }

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --- 通用 Node.js（可选） ---
      - name: 安装 Node.js (LTS)
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      # --- Linux 专用：构建 musl 工具链 ---
      - name: Linux - 构建 musl 和 libc++ 静态库
        if: matrix.target_os == 'linux'
        run: |
          set -e
          SYSROOT="$PWD/musl-sysroot"
          mkdir -p "$SYSROOT"

          # 1. 下载 musl 源码并编译
          git clone --depth 1 https://git.musl-libc.org/git/musl musl-src
          cd musl-src
          ./configure --prefix=/usr --disable-shared --syslibdir=/usr/lib
          make -j$(nproc)
          make DESTDIR="$SYSROOT" install
          cd ..

          # 2. 下载 LLVM 源码（用于 libc++）
          git clone --depth 1 --branch "llvmorg-${{ github.event.inputs.llvm_version }}" https://github.com/llvm/llvm-project.git llvm-project

          # 3. 使用宿主 clang 编译 libc++ 和 libc++abi（针对 musl 目标，静态）
          mkdir build-libcxx && cd build-libcxx
          # 设置编译器为宿主 clang，目标为 musl 三元组，并指定 sysroot
          export CC=/usr/bin/clang
          export CXX=/usr/bin/clang++
          export CFLAGS="--target=${{ matrix.triple }} --sysroot=$SYSROOT"
          export CXXFLAGS="--target=${{ matrix.triple }} --sysroot=$SYSROOT"
          export LDFLAGS="--target=${{ matrix.triple }} --sysroot=$SYSROOT"
          cmake -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$SYSROOT/usr" \
            -DLLVM_ENABLE_PROJECTS="libcxx;libcxxabi" \
            -DLLVM_TARGETS_TO_BUILD="host" \
            -DLIBCXX_ENABLE_STATIC=ON \
            -DLIBCXX_ENABLE_SHARED=OFF \
            -DLIBCXXABI_ENABLE_STATIC=ON \
            -DLIBCXXABI_ENABLE_SHARED=OFF \
            -DLIBCXX_USE_COMPILER_RT=OFF \
            -DLIBCXXABI_USE_COMPILER_RT=OFF \
            -DCMAKE_CXX_STANDARD=17 \
            ../llvm-project/llvm
          ninja -j$(nproc) install
          cd ..

          echo "musl 和 libc++ 静态库已安装到 $SYSROOT"
        shell: bash

      # --- Linux 专用：静态编译 Clang ---
      - name: Linux - 静态编译 Clang (链接 musl)
        if: matrix.target_os == 'linux'
        run: |
          set -e
          SYSROOT="$PWD/musl-sysroot"
          INSTALL_DIR="$PWD/install"
          rm -rf "$INSTALL_DIR"
          mkdir -p "$INSTALL_DIR"

          mkdir build && cd build
          export CC=/usr/bin/clang
          export CXX=/usr/bin/clang++
          # 使用 musl 目标，并指定 sysroot
          export CFLAGS="--target=${{ matrix.triple }} --sysroot=$SYSROOT -static"
          export CXXFLAGS="--target=${{ matrix.triple }} --sysroot=$SYSROOT -static -stdlib=libc++"
          export LDFLAGS="--target=${{ matrix.triple }} --sysroot=$SYSROOT -static -Wl,--no-as-needed"
          # 禁用所有外部依赖，避免额外动态链接
          cmake -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$INSTALL_DIR" \
            -DLLVM_ENABLE_PROJECTS="clang;clang-tools-extra" \
            -DLLVM_ENABLE_RUNTIMES="libcxx;libcxxabi" \
            -DLLVM_TARGETS_TO_BUILD="host" \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_DOCS=OFF \
            -DCLANG_DEFAULT_CXX_STDLIB=libc++ \
            -DLLVM_ENABLE_ZLIB=OFF \
            -DLLVM_ENABLE_LIBXML2=OFF \
            -DLLVM_ENABLE_TERMINFO=OFF \
            -DLLVM_ENABLE_LIBEDIT=OFF \
            -DLLVM_ENABLE_FFI=OFF \
            -DLLVM_ENABLE_PIC=OFF \
            -DLLVM_BUILD_STATIC=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_EXE_LINKER_FLAGS="-static -Wl,--no-as-needed" \
            -DCMAKE_CXX_STANDARD=17 \
            -DCMAKE_C_STANDARD=11 \
            ../llvm-project/llvm
          ninja -j$(nproc) install
          cd ..
          # 复制 sysroot 到 install（供用户后续使用）
          cp -r "$SYSROOT" "$INSTALL_DIR/sysroot"
        shell: bash

      # --- macOS 专用：使用系统 clang 构建 ---
      - name: macOS - 安装工具并构建
        if: matrix.target_os == 'macos'
        run: |
          brew install ninja
          INSTALL_DIR="$PWD/install"
          rm -rf "$INSTALL_DIR"
          mkdir -p "$INSTALL_DIR"
          mkdir build && cd build
          /usr/bin/clang --version
          cmake -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$INSTALL_DIR" \
            -DLLVM_ENABLE_PROJECTS="clang;clang-tools-extra" \
            -DLLVM_ENABLE_RUNTIMES="libcxx;libcxxabi" \
            -DLLVM_TARGETS_TO_BUILD="host" \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_DOCS=OFF \
            -DCLANG_DEFAULT_CXX_STDLIB=libc++ \
            -DCMAKE_C_COMPILER=/usr/bin/clang \
            -DCMAKE_CXX_COMPILER=/usr/bin/clang++ \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="${{ github.event.inputs.macos_deployment_target }}" \
            ../llvm-project/llvm
          ninja -j$(sysctl -n hw.ncpu) install
        shell: bash

      # --- Windows 专用：下载 LLVM-MinGW 构建 ---
      - name: Windows - 下载 LLVM-MinGW 并构建
        if: matrix.target_os == 'windows'
        run: |
          $LLVM_MINGW_VERSION = "20241119"
          $DOWNLOAD_URL = "https://github.com/mstorsjo/llvm-mingw/releases/download/$LLVM_MINGW_VERSION/llvm-mingw-$LLVM_MINGW_VERSION-msvcrt-x86_64.zip"
          Invoke-WebRequest -Uri $DOWNLOAD_URL -OutFile llvm-mingw.zip
          Expand-Archive -Path llvm-mingw.zip -DestinationPath .
          $MINGW_PATH = Join-Path $PWD "llvm-mingw-$LLVM_MINGW_VERSION-msvcrt-x86_64"
          $BIN_PATH = Join-Path $MINGW_PATH "bin"
          echo "$BIN_PATH" >> $env:GITHUB_PATH
          # 使用 mingw 的 clang 编译
          mkdir build; cd build
          cmake -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$env:INSTALL_DIR" -DLLVM_ENABLE_PROJECTS="clang;clang-tools-extra" -DLLVM_ENABLE_RUNTIMES="libcxx;libcxxabi" -DLLVM_TARGETS_TO_BUILD="host" -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_SYSTEM_NAME=Windows -DCMAKE_SYSTEM_PROCESSOR=${{ matrix.arch }} -DLLVM_DEFAULT_TARGET_TRIPLE=${{ matrix.triple }} -DLLVM_INCLUDE_BENCHMARKS=OFF -DLLVM_INCLUDE_TESTS=OFF -DLLVM_INCLUDE_EXAMPLES=OFF -DLLVM_INCLUDE_DOCS=OFF -DCLANG_DEFAULT_CXX_STDLIB=libc++ ../llvm-project/llvm
          ninja install
        shell: pwsh

      # --- 通用：验证并打包 ---
      - name: 验证 Clang 并打包
        run: |
          INSTALL_DIR="$PWD/install"
          echo "--- 验证 clang ---"
          "$INSTALL_DIR/bin/clang" --version
          if [[ "${{ matrix.target_os }}" == "linux" ]]; then
            echo "--- 检查 clang 是否为静态链接（应输出 'not a dynamic executable'） ---"
            file "$INSTALL_DIR/bin/clang" || true
          fi
          # 打包
          case "${{ matrix.arch }}" in
            x86_64) ARCH_NAME="x86" ;;
            aarch64|arm64) ARCH_NAME="ARM" ;;
            riscv64) ARCH_NAME="RISC-V" ;;
            *) ARCH_NAME="${{ matrix.arch }}" ;;
          esac
          case "${{ matrix.target_os }}" in
            linux) OS_NAME="Linux" ;;
            macos) OS_NAME="macOS" ;;
            windows) OS_NAME="Windows" ;;
            *) OS_NAME="${{ matrix.target_os }}" ;;
          esac
          PACKAGE_NAME="StaticClangChain--64-bit--${ARCH_NAME}--${OS_NAME}.tar.gz"
          echo "PACKAGE_NAME=$PACKAGE_NAME" >> $GITHUB_ENV
          tar czf "$PACKAGE_NAME" -C "$PWD" install/
        shell: bash

      - name: 上传 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "StaticClang-${{ github.event.inputs.llvm_version }}"
          name: "StaticClang-${{ github.event.inputs.llvm_version }}"
          files: ${{ env.PACKAGE_NAME }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
